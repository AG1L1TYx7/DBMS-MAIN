# ============================================
# Restaurant Management System
# Database Configuration File
# ============================================
# 
# SETUP INSTRUCTIONS:
# 1. Copy this file or edit directly
# 2. Update the values below to match YOUR MySQL setup
# 3. Save the file
#
# DEFAULT VALUES (work for most MySQL installations):
# - Host: localhost
# - Port: 3306
# - Database: restaurant_db
# - Username: root
# - Password: (empty for XAMPP/MAMP, or your MySQL root password)
#
# ============================================

# Database Host (usually localhost)
db.host=localhost

# Database Port (default MySQL port is 3306)
db.port=3306

# Database Name (don't change unless you renamed the database)
db.name=restaurant_db

# MySQL Username (default is 'root')
db.username=root

# MySQL Password
# - Leave empty if using XAMPP/MAMP with no password
# - Enter your MySQL root password if you set one
# - Example: db.password=mypassword123
db.password=

# ============================================
# ADVANCED SETTINGS (usually don't need to change)
# ============================================

# Use SSL (false for local development)
db.useSSL=false

# Server Timezone
db.serverTimezone=UTC

# Allow Public Key Retrieval (needed for some MySQL 8.0 configurations)
db.allowPublicKeyRetrieval=true

# Auto Reconnect
db.autoReconnect=true

# Character Encoding
db.characterEncoding=UTF-8
